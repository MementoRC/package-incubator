name: Build all packages

# this is important for trusted publishing
permissions:
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: linux-64, os: ubuntu-latest, build: linux-64 }
          - { target: linux-aarch64, os: ubuntu-latest, build: linux-64 }
          - { target: linux-ppc64le, os: ubuntu-latest, build: linux-64 }
          - { target: linux-riscv64, os: ubuntu-latest, build: linux-64 }
          - { target: win-64, os: windows-latest, build: win-64 }
          # - { target: win-arm64, os: windows-latest, build: win-64 }
          # - { target: win-64, os: windows-11-arm, build: win-arm64 }
          # - { target: win-arm64, os: windows-11-arm, build: win-arm64 }
          # - { target: osx-64, os: macos-15-intel, build: osx-arm64 }
          - { target: osx-64, os: macos-14, build: osx-arm64 }
          - { target: osx-arm64, os: macos-14, build: osx-arm64 }
      fail-fast: false

    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.65.0

      - name: Add .pixi/envs/default/bin to the $PATH
        shell: bash
        run: |
          echo "$(pwd)/.pixi/envs/default/bin" >> $GITHUB_PATH

      - name: Restore zig-llvm cache
        uses: actions/cache/restore@v4
        with:
          path: output/${{ matrix.target }}/*.conda
          key: zig-llvm-${{ matrix.target }}-${{ hashFiles('recipes/zig-llvm/**') }}
          restore-keys: |
            zig-llvm-${{ matrix.target }}-

      - name: Build zig-llvm (skips if cached package matches)
        shell: bash
        run: |
          rattler-build build --recipe recipes/zig-llvm \
            --skip-existing=all --build-platform=${{ matrix.build }} --target-platform=${{ matrix.target }} \
            -c https://prefix.dev/prefix-package-incubator -c conda-forge

      - name: Save zig-llvm cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: output/${{ matrix.target }}/*.conda
          key: zig-llvm-${{ matrix.target }}-${{ hashFiles('recipes/zig-llvm/**') }}

      - name: Restore zig-zig cache
        uses: actions/cache/restore@v4
        with:
          path: output/${{ matrix.target }}/zig-zig*.conda
          key: zig-zig-${{ matrix.target }}-${{ hashFiles('recipes/zig-zig/**') }}
          restore-keys: |
            zig-zig-${{ matrix.target }}-

      - name: Build zig-zig (skips if cached package matches)
        shell: bash
        run: |
          rattler-build build --recipe recipes/zig-zig \
            --skip-existing=all --build-platform=${{ matrix.build }} --target-platform=${{ matrix.target }} \
            -c https://prefix.dev/prefix-package-incubator -c conda-forge

      - name: Save zig-zig cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: output/${{ matrix.target }}/zig-zig*.conda
          key: zig-zig-${{ matrix.target }}-${{ hashFiles('recipes/zig-zig/**') }}

      - name: Build zig-zig-llvm (skips if cached package matches)
        shell: bash
        run: |
          rattler-build build --recipe recipes/zig-zig-llvm \
            --skip-existing=all --build-platform=${{ matrix.build }} --target-platform=${{ matrix.target }} \
            -c https://prefix.dev/prefix-package-incubator -c conda-forge

      - name: Save zig-zig-llvm cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: output/${{ matrix.target }}/zig-zig-llvm*.conda
          key: zig-zig-llvm-${{ matrix.target }}-${{ hashFiles('recipes/zig-zig-llvm/**') }}

      - name: Build QEMU user
        shell: bash
        run: |
          rattler-build build --recipe recipes/zig-qemu \
            --skip-existing=all --build-platform=${{ matrix.build }} --target-platform=${{ matrix.target }} \
            -c https://prefix.dev/prefix-package-incubator -c conda-forge

      - name: Upload all packages
        shell: bash
        # do not upload on PR
        if: github.event_name == 'push'
        run: |
          # uses trusted publishers for the upload
          for file in output/**/*.conda; do
            rattler-build upload prefix -c prefix-package-incubator "$file"
          done
