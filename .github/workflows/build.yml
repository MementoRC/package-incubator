  build-cross-macos:
    needs: [build-native-macos]
    # needs: [build-native-macos, build-native-macos-phase2]
    name: osx-64 (cross)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
      - name: Add .pixi/envs/default/bin to the $PATH
        shell: bash
        run: echo "$(pwd)/.pixi/envs/default/bin" >> $GITHUB_PATH

      - name: Download native osx-arm64 artifacts (phase 1 + phase 2)
        uses: actions/download-artifact@v4
        with:
          pattern: native-osx-arm64-*
          path: output/osx-arm64/
          merge-multiple: true

      - name: Index local channel
        run: pixi run python -m conda_index output/

      # - name: Debug - list downloaded artifacts
      #   run: find output/osx-arm64/ -type f | sort

      - name: Restore zig-llvm-16 cache
        uses: actions/cache/restore@v4
        with:
          path: output/osx-64/*.conda
          key: zig-llvm-16-osx-64-${{ hashFiles('recipes/zig-llvm-16/**') }}
      - name: Build zig-llvm-16
        shell: bash
        run: |
          rattler-build build --recipe recipes/zig-llvm-16 \
            --skip-existing=local --build-platform=osx-arm64 --target-platform=osx-64 \
            -c https://prefix.dev/prefix-package-incubator -c conda-forge
      - name: Prune stale zig-llvm-16 artifacts
        shell: bash
        run: bash .github/scripts/prune-stale-artifacts.sh output 'zig-llvm-16-*'
      - name: Save zig-llvm-16 cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: output/osx-64/*.conda
          key: zig-llvm-16-osx-64-${{ hashFiles('recipes/zig-llvm-16/**') }}

      - name: Restore zig-16 cache
        uses: actions/cache/restore@v4
        with:
          path: output/osx-64/*.conda
          key: zig-16-osx-64-${{ hashFiles('recipes/zig-0.16.0/**') }}
      - name: Build zig-16
        shell: bash
        run: |
          rattler-build build --recipe recipes/zig-0.16.0 \
            --skip-existing=local --build-platform=osx-arm64 --target-platform=osx-64 \
            -c https://prefix.dev/prefix-package-incubator -c conda-forge
      - name: Prune stale zig-16 artifacts
        shell: bash
        run: bash .github/scripts/prune-stale-artifacts.sh output 'zig-16-[0-9]*'
      - name: Save zig-16 cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: output/osx-64/*.conda
          key: zig-16-osx-64-${{ hashFiles('recipes/zig-0.16.0/**') }}
      - name: Upload packages to prefix.dev
        if: github.event_name == 'push'
        shell: bash
        run: |
          for file in output/**/*.conda; do
            rattler-build upload prefix -c prefix-package-incubator "$file"
          done

      - name: Upload packages to prefix.dev
        if: github.event_name == 'push'
        shell: bash
        run: |
          for file in output/**/*.conda; do
            rattler-build upload prefix -c prefix-package-incubator "$file"
          done

  build-cross-windows:
    needs: [build-native-windows]
    # needs: [build-native-windows, build-native-windows-phase2]
    name: win-arm64 (cross)
    # pinned: see win-64 (native) above
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
      - name: Add .pixi/envs/default/bin to the $PATH
        shell: bash
        run: echo "$(pwd)/.pixi/envs/default/bin" >> $GITHUB_PATH

      - name: Trim PATH headroom for vcvars (win-arm64)
        shell: pwsh
        run: |
          # rattler-build activates BOTH h_env and build_env in one process, so
          # vcvars64.bat runs TWICE and each run prepends VS/SDK dirs to PATH
          # without dedup. The second run overflows cmd.exe's 8191-char limit
          # ("The input line is too long.", PR #17 run 31289796068 job 93184921225).
          # Shrink the starting PATH so the doubled result still fits. PATH is
          # never echoed by vcvars (@echo off), so print lengths to make the
          # headroom measurable in future runs.
          $before = $env:PATH
          Write-Host "PATH length before: $($before.Length)"
          $drop = @(
            '\Android\', '\android-sdk', '\Java\', '\jdk', '\Microsoft SDKs\Azure',
            '\Program Files\dotnet', '\chocolatey', '\Strawberry\', '\Ruby',
            '\ghcup', '\cabal', '\mingw64\bin', '\Program Files\R\',
            '\SeleniumWebDrivers', '\Program Files\PowerShell\7-preview',
            '\hostedtoolcache\windows\Ruby', '\hostedtoolcache\windows\go',
            '\hostedtoolcache\windows\node', '\Microsoft Service Fabric',
            # second pass: none of the below are used by this build, and they
            # survived the original list. Keep Git (bash), CMake, Python,
            # PowerShell 7, pixi and the C:\Windows core dirs.
            '\MongoDB', '\mongosh', '\aliyun-cli', '\vcpkg', '\NSIS',
            '\tools\zstd', '\Mercurial', '\hostedtoolcache\windows\stack',
            '\MySQL', '\sbt\bin', '\GitHub CLI', '\pipx_bin', '\npm\prefix',
            '\OpenSSL\bin', '\kotlinc', '\Java_Temurin', '\ImageMagick',
            '\ProgramData\kind', '\Web Platform Installer', '\TortoiseSVN',
            '\Microsoft SQL Server', '\Windows Performance Toolkit',
            '\WiX Toolset', '\Service Fabric', '\Program Files\nodejs',
            '\tools\php', '\Amazon\', '\Program Files\LLVM',
            '\Program Files (x86)\LLVM', '\.dotnet\tools', '\.cargo\bin',
            '\WindowsApps'
          )
          $kept = @()
          foreach ($p in ($before -split ';')) {
            if (-not $p) { continue }
            $skip = $false
            foreach ($d in $drop) { if ($p -like "*$d*") { $skip = $true; break } }
            if (-not $skip -and ($kept -notcontains $p)) { $kept += $p }
          }
          $after = ($kept -join ';')
          Write-Host "PATH length after:  $($after.Length)  (entries: $($kept.Count))"
          Write-Host "PATH budget: cmd.exe hard limit is 8191 chars"
          "PATH=$after" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download native win-64 artifacts (phase 1 + phase 2)
        uses: actions/download-artifact@v4
        with:
          pattern: native-win-64-*
          path: output/win-64/
          merge-multiple: true

      - name: Index local channel
        run: pixi run python -m conda_index output/

      # - name: Debug - list downloaded artifacts
      #   run: ls output/win-64/

      - name: Restore zig-llvm-16 cache
        uses: actions/cache/restore@v4
        with:
          path: output/win-arm64/*.conda
          key: zig-llvm-16-win-arm64-${{ hashFiles('recipes/zig-llvm-16/**') }}
      - name: Build zig-llvm-16
        shell: bash
        run: |
          env -u 'ProgramFiles(x86)' -u 'CommonProgramFiles(x86)' \
          rattler-build build --recipe recipes/zig-llvm-16 \
            --skip-existing=local --build-platform=win-64 --target-platform=win-arm64 \
            -c https://prefix.dev/prefix-package-incubator -c conda-forge
      - name: DIAG dump build_env.sh on failure (win-arm64)
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for f in output/bld/rattler-build_*/work/build_env.sh; do
            found=1
            echo "=== $f ==="
            grep -n '[()]' "$f" || echo "(no parens found)"
            echo "--- lines 15-25 ---"
            sed -n '15,25p' "$f"
            echo "=== end $f ==="
          done
          [ "$found" = 1 ] || echo "no build_env.sh found under output/bld/"
      - name: Prune stale zig-llvm-16 artifacts
        shell: bash
        run: bash .github/scripts/prune-stale-artifacts.sh output 'zig-llvm-16-*'
      - name: Save zig-llvm-16 cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: output/win-arm64/*.conda
          key: zig-llvm-16-win-arm64-${{ hashFiles('recipes/zig-llvm-16/**') }}

      - name: Restore zig-16 cache
        uses: actions/cache/restore@v4
        with:
          path: output/win-arm64/*.conda
          key: zig-16-win-arm64-${{ hashFiles('recipes/zig-0.16.0/**') }}
      - name: Build zig-16
        shell: bash
        run: |
          env -u 'ProgramFiles(x86)' -u 'CommonProgramFiles(x86)' \
          rattler-build build --recipe recipes/zig-0.16.0 \
            --skip-existing=local --build-platform=win-64 --target-platform=win-arm64 \
            -c https://prefix.dev/prefix-package-incubator -c conda-forge
      - name: Prune stale zig-16 artifacts
        shell: bash
        run: bash .github/scripts/prune-stale-artifacts.sh output 'zig-16-[0-9]*'
      - name: Save zig-16 cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: output/win-arm64/*.conda
          key: zig-16-win-arm64-${{ hashFiles('recipes/zig-0.16.0/**') }}

      - name: Upload packages to prefix.dev
        if: github.event_name == 'push'
        shell: bash
        run: |
          for file in output/**/*.conda; do
            rattler-build upload prefix -c prefix-package-incubator "$file"
          done

      - name: Upload packages to prefix.dev
        if: github.event_name == 'push'
        shell: bash
        run: |
          for file in output/**/*.conda; do
            rattler-build upload prefix -c prefix-package-incubator "$file"
          done
