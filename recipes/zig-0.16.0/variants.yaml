c_stdlib:
  - if: linux
    then:
      - sysroot
  - if: osx
    then:
      - macosx_deployment_target
  - if: not unix
    then:
      - vs

c_stdlib_version:
  - if: linux and not riscv64
    then:
      - "2.17"
  - if: riscv64
    then:
      - "2.39"
  - if: osx
    then:
      - "11.3"

channel_targets:
  - conda-forge zig_experimental

zig_compiler:
  - zig
zig_compiler_version:
  - "0.16.0 *_9"

cross_target_platform_:
  - linux-64
  - linux-aarch64
  - linux-ppc64le
  - linux-riscv64
  - linux-s390x
  - osx-64
  - osx-arm64
  - win-32
  - win-64
  - win-arm64

