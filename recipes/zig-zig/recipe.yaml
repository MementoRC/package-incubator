schema_version: 1

context:
  build_number: 112
  name: zig-zig
  version: "0.15.2"

  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  sh: ${{ ".bat" if not unix else ".sh" }}
  bat: ${{ ".bat" if not unix else "" }}
  exe: ${{ ".exe" if not unix else "" }}
  zig: ${{ "zig-" if riscv64 else "" }}

  # Zig target mapping (for zig -target flag, differs from GCC triplets)
  # win-64/win-arm64 use gnu ABI to match zig-llvm's MinGW-built libcxx/libcxxabi.
  zig_triplet: >-
    ${{
      "x86_64-linux-gnu." ~ c_stdlib_version        if cross_target_platform_ == "linux-64"      else
      "aarch64-linux-gnu." ~ c_stdlib_version       if cross_target_platform_ == "linux-aarch64" else
      "powerpc64le-linux-gnu." ~ c_stdlib_version   if cross_target_platform_ == "linux-ppc64le" else
      "riscv64-linux-gnu.2.39"                       if cross_target_platform_ == "linux-riscv64" else
      "s390x-linux-gnu." ~ c_stdlib_version         if cross_target_platform_ == "linux-s390x"   else
      "x86_64-macos." ~ c_stdlib_version            if cross_target_platform_ == "osx-64"        else
      "aarch64-macos." ~ c_stdlib_version           if cross_target_platform_ == "osx-arm64"     else
      "x86_64-windows-gnu"                          if cross_target_platform_ == "win-64"        else
      "aarch64-windows-gnu"                         if cross_target_platform_ == "win-arm64"     else
      "native"
    }}

  # Wrapper target triplet — same as zig_triplet except win uses gnu ABI
  # so installed wrappers are named x86_64-windows-gnu-zig-cc.exe (zig-llvm expects this).
  zig_wrapper_triplet: >-
    ${{
      "x86_64-linux-gnu." ~ c_stdlib_version        if cross_target_platform_ == "linux-64"      else
      "aarch64-linux-gnu." ~ c_stdlib_version       if cross_target_platform_ == "linux-aarch64" else
      "powerpc64le-linux-gnu." ~ c_stdlib_version   if cross_target_platform_ == "linux-ppc64le" else
      "riscv64-linux-gnu.2.39"                       if cross_target_platform_ == "linux-riscv64" else
      "s390x-linux-gnu." ~ c_stdlib_version         if cross_target_platform_ == "linux-s390x"   else
      "x86_64-macos." ~ c_stdlib_version            if cross_target_platform_ == "osx-64"        else
      "aarch64-macos." ~ c_stdlib_version           if cross_target_platform_ == "osx-arm64"     else
      "x86_64-windows-gnu"                          if cross_target_platform_ == "win-64"        else
      "aarch64-windows-gnu"                         if cross_target_platform_ == "win-arm64"     else
      "native"
    }}

  # Stripped zig target (no glibc version suffix) — matches wrapper filename prefix
  zig_target: >-
    ${{
      "x86_64-linux-gnu"                            if cross_target_platform_ == "linux-64"      else
      "aarch64-linux-gnu"                           if cross_target_platform_ == "linux-aarch64" else
      "powerpc64le-linux-gnu"                       if cross_target_platform_ == "linux-ppc64le" else
      "riscv64-linux-gnu"                           if cross_target_platform_ == "linux-riscv64" else
      "s390x-linux-gnu"                             if cross_target_platform_ == "linux-s390x"   else
      "x86_64-macos." ~ c_stdlib_version            if cross_target_platform_ == "osx-64"        else
      "aarch64-macos." ~ c_stdlib_version           if cross_target_platform_ == "osx-arm64"     else
      "x86_64-windows-gnu"                          if cross_target_platform_ == "win-64"        else
      "aarch64-windows-gnu"                         if cross_target_platform_ == "win-arm64"     else
      "native"
    }}

  # Conda-style triplet for binary prefixes (e.g., x86_64-conda-linux-gnu-zig)
  conda_triplet: >-
    ${{
      "x86_64-conda-linux-gnu"                      if cross_target_platform_ == "linux-64"      else
      "aarch64-conda-linux-gnu"                     if cross_target_platform_ == "linux-aarch64" else
      "powerpc64le-conda-linux-gnu"                 if cross_target_platform_ == "linux-ppc64le" else
      "riscv64-conda-linux-gnu"                     if cross_target_platform_ == "linux-riscv64" else
      "s390x-conda-linux-gnu"                       if cross_target_platform_ == "linux-s390x"   else
      "x86_64-apple-darwin13.4.0"                   if cross_target_platform_ == "osx-64"        else
      "arm64-apple-darwin20.0.0"                    if cross_target_platform_ == "osx-arm64"     else
      "x86_64-w64-mingw32"                          if cross_target_platform_ == "win-64"        else
      "aarch64-w64-mingw32"                         if cross_target_platform_ == "win-arm64"     else
      "unknown"
    }}

  # Build mode detection helpers
  # Which platform builds cross-compilers for each target
  cross_build_platform: >-
    ${{
      "linux-64"                                    if cross_target_platform_ in [
          "linux-64",
          "linux-aarch64",
          "linux-ppc64le",
          "linux-riscv64",
          "linux-s390x"
       ]                                                                                         else
      build_platform                                if cross_target_platform_ in ["osx-64", "osx-arm64"] and build_platform in ["osx-64", "osx-arm64"] else
      build_platform                                if cross_target_platform_ in ["win-64", "win-arm64"] and build_platform in ["win-64", "win-arm64"] else
      "unknown"
    }}

  build_triplet: >-
    ${{
      "x86_64-conda-linux-gnu"                      if build_platform == "linux-64"              else
      "aarch64-conda-linux-gnu"                     if build_platform == "linux-aarch64"         else
      "powerpc64le-conda-linux-gnu"                 if build_platform == "linux-ppc64le"         else
      "x86_64-apple-darwin13.4.0"                   if build_platform == "osx-64"                else
      "arm64-apple-darwin20.0.0"                    if build_platform == "osx-arm64"             else
      "x86_64-w64-mingw32"                          if build_platform == "win-64"                else
      "aarch64-w64-mingw32"                         if build_platform == "win-arm64"             else
      "unknown"
    }}

  is_hosted_xcompiler: ${{ build_platform == target_platform and cross_target_platform_ != target_platform and cross_build_platform == build_platform }}
  is_unhosted_xcompiler: ${{ cross_target_platform_ == "osx-64" and target_platform == "osx-arm64" and build_platform == "osx-arm64" or cross_target_platform_ == "win-64" and target_platform == "win-arm64" and build_platform == "win-arm64" }}
  xc_build_platform: >-
    ${{
      build_platform                                if is_hosted_xcompiler                               else
      "osx-arm64"                                   if cross_target_platform_ == "osx-64"                else
      "win-arm64"                                   if cross_target_platform_ == "win-64"                else
      "unknown"
    }}

  xc_build_triplet: >-
    ${{
      "arm64-apple-darwin20.0.0"                    if cross_target_platform_ == "osx-64"                else
      "aarch64-w64-mingw32"                         if cross_target_platform_ == "win-64"                else
      build_triplet
    }}

  is_native: ${{ build_platform == target_platform and cross_target_platform_ == build_platform }}
  is_cross_compiler: ${{ is_hosted_xcompiler or is_unhosted_xcompiler }}
  is_cross_target: ${{ build_platform != target_platform and cross_target_platform_ == target_platform }}

  # Keyword that `file` prints for each Linux target arch (for cross-build arch verification).
  # `file` output differs from conda platform names: PowerPC (not ppc64le), RISC-V (not riscv64).
  file_arch_keyword: >-
    ${{
      "PowerPC"  if cross_target_platform_ == "linux-ppc64le" else
      "RISC-V"   if cross_target_platform_ == "linux-riscv64" else
      "IBM S/390" if cross_target_platform_ == "linux-s390x"  else
      cross_target_platform_ | replace("linux-", "")
    }}
  
recipe:
  name: zig-package
  version: ${{ version }}

source:
  - url: https://github.com/ziglang/zig/archive/refs/tags/${{ version }}.tar.gz
    sha256: ebe6eb7006f6bbb72e54bd25d0675f2794084909d63a95aa315f2dcf2af5fd99
    patches:
      # Relax LLVM target requirements to match zig-llvm package
      - patches/relax-llvm-required-targets.patch
      - patches/disable-unsupported-llvm-targets.patch
      - patches/comment-unsupported-llvm-target-bindings.patch
      - patches/Lld.zig-prefer-shared-libcxx.patch
      # All platforms: wire LLD MachO into zig cc pipeline + allow -fuse-ld=lld
      - patches/Lld.zig-macho-lld-support.patch
      - patches/llvm.zig-lld-ofmt-macho.patch
      - patches/Config.zig-macho-no-auto-lld.patch
      - patches/main.zig-fuse-ld-lld-cc-path.patch
      # All platforms: fix MinGW .def LIBRARY lines missing .dll suffix (api-ms-win-* family)
      - patches/zig_llvm.cpp-mingw-def-dll-suffix.patch
      - if: unix
        then:
          # Reduce max_rss from 7.8GB to 7.0GB (CI runners have limited memory)
          - patches/linux/build.zig-01-maxrss.patch
      - if: linux
        then:
          - patches/linux/build.zig-02-doctest-forward-target.patch
          - patches/linux/build.zig-03-allow-shlib-undefined.patch
          - patches/linux/build.zig-04-link-pthread-dl.patch
          # Fix segfault: zig LLD defaults image_base=0xfff000 for non-PIE, causing
          # DYNAMIC segment to fall outside LOAD segments with shared LLVM linking
          - patches/linux/build.zig-05-image-base.patch
          # Ported from feedstock-2: linker, sysroot, and runtime fixes
          - patches/linux/posix.zig-glibc-2.17-fstat.patch
          - patches/linux/llvm.zig-triple-no-glibc-version.patch
          - patches/linux/Object.zig-elf-zstd-decompression.patch
          - patches/linux/Elf.zig-debug-tag-bare-TODO-panics.patch
          - patches/linux/link.zig-01-ldscript-relpath-and-l-flags.patch
          - patches/linux/link.zig-02-default-allow-so-scripts.patch
          - patches/linux/link.zig-03-ldscript-sysroot-remap.patch
      - if: linux and (x86_64 or ppc64le)
        then:
          # Phase 0001: Architecture Support (add PowerPC64LE to CPU arch switches)
          - patches/ppc64le/0001-arch-support-relocation.zig.patch
          - patches/ppc64le/0001-arch-support-LdScript.zig.patch
          - patches/ppc64le/0001-arch-support-Elf.zig.patch
          - patches/ppc64le/0001-arch-support-Atom.zig.patch
          - patches/ppc64le/0001-arch-support-LinkerDefined.zig.patch
          - patches/ppc64le/0001-arch-support-ZigObject.zig.patch
          - patches/ppc64le/0001-arch-support-synthetic_sections.zig.patch
          - patches/ppc64le/0001-arch-support-eh_frame.zig.patch
          - patches/ppc64le/0001-arch-support-Thunk.zig.patch
          - patches/ppc64le/0001-arch-support-st-other-Object.zig.patch
          - patches/ppc64le/0001-arch-support-st-other-SharedObject.zig.patch
          - patches/ppc64le/0001-no-lld-build.zig.patch
          # Phase 0002: Build Configuration (LLVM backend, library paths)
          - patches/ppc64le/0002-build-config-build.zig.patch
          # Phase 0003: Linker Redirection (comprehensive GCC linker with full flag translation)
          - patches/ppc64le/0003-linker-redirect-link.zig.patch
          - patches/ppc64le/0003-ldscript-output-format.patch
          - patches/ppc64le/0003-gcc-linker-comprehensive-Lld.zig.patch
      - if: not unix
        then:
          - patches/non_unix/build.zig-maxrss-search-prefix.patch
          - patches/non_unix/Findllvm.cmake-windows-cross-manual-override.patch
          - patches/non_unix/CMakeLists.txt-01-correct-LLVM_LIBRARIES.patch
          - patches/non_unix/Lld.zig-remove-ucrt.patch
          - patches/non_unix/CMakeLists.txt-02-MD-libzigcpp.patch
    target_directory: zig-source

outputs:
  # ==========================================================================
  # IMPLEMENTATION: zig-zig_impl_$cross_target_platform_ (binaries + stdlib ONLY)
  # Contains actual zig compiler binary (triplet-prefixed) and standard library
  # NO activation scripts, NO wrappers - just the implementation
  # ==========================================================================
  - package:
      name: zig-zig_impl_${{ cross_target_platform_ }}
    build:
      number: ${{ build_number }}
      skip: not (is_native or is_cross_target) or cross_target_platform_ == "linux-s390x"
      dynamic_linking:
        rpath_allowlist:
          - if: osx
            then:
              - "@loader_path/../lib/zig-llvm/lib"
              - "@loader_path/../lib"
        missing_dso_allowlist:
          - if: osx
            then: /usr/lib/libSystem.B.dylib
          - if: not unix
            then: "*/VERSION.dll"
      script:
        file: build${{ sh }}
        env:
          BUILD_NUMBER: ${{ build_number }}
          CONDA_TRIPLET: ${{ conda_triplet }}
          ZIG_TRIPLET: ${{ zig_triplet }}
          ZIG_WRAPPER_TRIPLET: ${{ zig_wrapper_triplet }}

          CONDA_ZIG_BUILD: ${{ build_triplet ~ "-zig" }}
          CONDA_ZIG_HOST: ${{ conda_triplet ~ "-zig" }}
          
          CMAKE_FALLBACK: "0"
          
          # --- FORCING REBUILD of native zig due to incompatible previous build version in conda-forge ---
          # BUILD_NATIVE_ZIG: ${{ cross_target_platform_ == "linux-ppc64le" and is_cross_compiler }}

          # --- DEBUGGING ---
          # DEBUG_ZIG_BUILD: "1"
          # ZIG_USE_CACHE: "0"
    requirements:
      build:
        # --- Common build deps (all cases) ---
        - if: not riscv64
          then:
            - ${{ stdlib('c') }}
        - ${{ m2 }}bash >=5.2
        - ${{ m2 }}file
        - cmake >=3.5
        - ninja
        - perl 5.32.*
        - python 3.12.*
        - if: not unix
          then:
            - ${{ m2 }}gawk
            - ${{ m2 }}coreutils
            - ${{ m2 }}findutils
            - ${{ m2 }}which
        - if: arm64
          then:
            - libxml2-devel
        - if: build_platform != target_platform
          then:
            - llvmdev ${{ llvm_version }}.*
            - if: linux
              then:
                - qemu-execve-${{ target_platform | replace("linux-", "") }}

        # Self-hosting: build zig with zig (conda-forge zig + self-staged wrappers).
        # Wrappers are staged at build time from RECIPE_DIR/scripts/ by build.sh,
        # replacing the former zig-gcc build dependency (kept as fallback recipe).
        - zig >=0.15.2,<0.16
        - if: ppc64le
          then:
            # ppc64le patches redirect zig linking to powerpc64le-conda-linux-gnu-gcc
            # (LLD lacks PowerPC64 relocation support); cross-gcc must be on PATH at build time
            - gcc_impl_${{ target_platform }} >=14.3
            - binutils_impl_${{ target_platform }} >=2.45
      host:
        # --- Development ---
        - zig-llvm ${{ llvm_version }}.*
        - ${{ zig }}libxml2
        - ${{ zig }}zlib
        - ${{ zig }}zstd
        - if: not riscv64
          then:
            - libxml2-devel
      run:
        - ${{ zig }}libxml2
        - if: ppc64le
          then:
            # We redirect linking to gcc/ld.bfd
            - binutils_impl_${{ target_platform }} >=2.45
            - gcc_impl_${{ target_platform }} >=14.3
      ignore_run_exports:
        by_name:
          - if: linux
            then:
              # libxml2's weak run_exports pull in libxml2-16 -> libgcc/icu/libiconv/liblzma
              # and icu -> libstdcxx. Zig only needs libxml2 at build time (via LLVM),
              # not at runtime. Ignore both the metapackage and the split library.
              - libxml2
              - libxml2-16
          - if: not unix
            then:
              - libxml2
              - libxml2-16
              - ucrt
              - vc14_runtime
              - zstd
    tests:
      # Package contents verification - impl has triplet-prefixed binary
      - package_contents:
          strict: true
          bin:
            - ${{ conda_triplet }}-zig*
            - if: not unix and x86_64
              then:
                # DLL isolation: .exe is a shim prepending zig-llvm/bin to PATH
                - ${{ conda_triplet }}-zig.real*
            - if: linux
              then:
                - ${{ conda_triplet }}-zig-cc-musl
          files:
            - if: build_platform == target_platform or target_platform in ["osx-64", "win-arm64"]
              then:
                - ${{ library }}doc/langref.html
            - ${{ library }}lib/zig/{c,compiler_rt,fuzzer,ubsan_rt}.zig
            - ${{ library }}lib/zig/zig.h
            - ${{ library }}lib/zig/build-web/*
            - ${{ library }}lib/zig/c/{common,inttypes,stdlib,string,strings}.zig
            - ${{ library }}lib/zig/compiler/*
            - ${{ library }}lib/zig/compiler_rt/*
            - ${{ library }}lib/zig/docs/*
            - ${{ library }}lib/zig/include/*
            - ${{ library }}lib/zig/init/*
            # Recursive: must include lib/zig/libc/mingw/lib-common/*.o
            # (ARM64 intrinsic stubs created by _win_arm64_stubs.sh).
            - ${{ library }}lib/zig/libc/**
            - ${{ library }}lib/zig/libcxx/*
            - ${{ library }}lib/zig/libcxxabi/*
            - ${{ library }}lib/zig/libunwind/*
            - ${{ library }}lib/zig/libtsan/*
            - ${{ library }}lib/zig/std/*
            - if: linux and x86_64
              then:
                # MUSL cross-compiling resources
                - lib/zig/musl/riscv64/ld-musl-riscv64.so.1
                - lib/zig/musl/riscv64/libzig-musl.so
                - lib/zig/musl/riscv64/libzig-musl.so.1
            # Post-install tests (etc/ is not Library-prefixed on non-Unix)
            - etc/conda/test-files/zig*
      # Functional test using triplet-prefixed binary
      - script:
          - if: linux
            then:
              - file $PREFIX/bin/${{ conda_triplet }}-zig
              - file -L $PREFIX/bin/${{ conda_triplet }}-zig | grep -qi '${{ file_arch_keyword }}'
          - if: osx
            then:
              # Fix zig-llvm dylib refs: test env gets a fresh zig-llvm install
              # where @rpath refs haven't been rewritten to @loader_path yet
              - bash testing/fix_zigllvm_dylibs.sh
              - python testing/debug_libcxx_isolation.py
          # Skip exec on cross-build: rattler-build doesn't activate the test
          # build env, so qemu-execve's binfmt_misc hook never fires and
          # cross-arch binaries fail with exit 126. File checks above verify
          # the binary arch on cross-build.
          - if: build_platform == target_platform
            then:
              - ${{ conda_triplet }}-zig version
              - ${{ conda_triplet }}-zig zen
              - ${{ conda_triplet }}-zig init
              - ${{ conda_triplet }}-zig test zig-source/test/behavior.zig
            else:
              - echo "Skip exec on cross-build (file checks above verify arch)"
        requirements:
          build:
            - if: linux and build_platform != target_platform
              then:
                - qemu-execve-${{ target_platform | replace("linux-", "") }}
          run:
            - if: osx
              then:
                - python 3.12.*
        files:
          source:
            - zig-source/test
          recipe:
            - if: osx
              then:
                - testing/fix_zigllvm_dylibs.sh
                - testing/debug_libcxx_isolation.py

      # Cross-compilation test — only run when we can actually execute the zig binary
      - if: linux and not x86_64 and build_platform == target_platform
        then:
          - script:
              - ${{ conda_triplet }}-zig cc -target ${{ zig_triplet }} -static -o hello_qemu testing/hello_qemu.c
              - file ./hello_qemu
            files:
              recipe:
                - testing/hello_qemu.c

  # ==========================================================================
  # ACTIVATION: zig_$cross_target_platform_ (scripts)
  # Contains activation scripts, depends on zig_impl_$cross_target_platform_
  # NO binaries - just the environment setup
  # ==========================================================================
  - package:
      name: zig-zig_${{ cross_target_platform_ }}
    build:
      number: ${{ build_number }}
      skip: not (is_native or is_cross_compiler or is_cross_target)
      script:
        file: install_zig_activation.py
        env:
          ZIG_TRIPLET: ${{ zig_triplet }}
          ZIG_WRAPPER_TRIPLET: ${{ zig_wrapper_triplet }}
          CONDA_TRIPLET: ${{ conda_triplet }}
          CROSS_COMPILER: ${{ is_cross_compiler }}
          NATIVE_TRIPLET: ${{ xc_build_triplet }}
          # Zig toolchain identification (independent of gcc TOOLCHAIN)
          # Includes -zig suffix so value is directly usable as binary name
          CONDA_ZIG_BUILD: ${{ xc_build_triplet ~ "-zig" ~ exe }}
          CONDA_ZIG_HOST: ${{ conda_triplet ~ "-zig" ~ exe }}
    requirements:
      build:
        - ${{ m2 }}bash
        - python 3.12.*
        # Need zig to compile .exe shims on non-Unix (cross-compiler shim)
        - if: is_cross_compiler and not unix
          then:
            - zig-zig_impl_${{ xc_build_platform }} >=${{ version }}
        # Cross-built target-native output (e.g. win-arm64 on a win-64 host): the .exe
        # shim must be compiled by a zig that RUNS on the build host, so pull the build
        # platform's impl. Without it, _find_zig_compiler falls back to CONDA_ZIG_HOST
        # (the aarch64 target zig), which cannot execute on the x86_64 build agent
        # (exit -1) — there is no ARM64 emulator on the win-64 builder.
        - if: is_cross_target and not unix
          then:
            - zig-zig_impl_${{ build_platform }} >=${{ version }}
      host:
        - if: not is_cross_compiler and not unix
          then:
            - ${{ pin_subpackage("zig-zig_impl_" ~ cross_target_platform_, exact=True) }}
      run:
        # For native/cross-target: depend on zig_impl for same cross_target_platform_ (pin_subpackage works)
        # For cross-compiler: depend on zig_impl for BUILD platform (external package)
        - if: is_cross_compiler
          then:
            - zig-zig_impl_${{ xc_build_platform }} >=${{ version }}
          else:
            - ${{ pin_subpackage("zig-zig_impl_" ~ cross_target_platform_, exact=True) }}
        - if: cross_target_platform_ == "linux-ppc64le"
          then:
            # ppc64le patches redirect zig linking to gcc/ld.bfd
            # (LLD lacks PowerPC64 relocation support)
            - binutils_impl_${{ cross_target_platform_ }} >=2.45
            - gcc_impl_${{ cross_target_platform_ }} >=14.3
    tests:
      - package_contents:
          strict: true
          bin:
            - if: is_cross_compiler
              then:
                - ${{ conda_triplet }}-zig
          files:
            - etc/conda/activate.d/zig_activate${{ sh }}
            - etc/conda/deactivate.d/zig_deactivate${{ sh }}
            
            - ${{ library }}share/zig/wrappers/${{ conda_triplet }}-zig-cc${{ exe }}
            - ${{ library }}share/zig/wrappers/${{ conda_triplet }}-zig-cxx${{ exe }}

            - ${{ library }}share/zig/wrappers/${{ conda_triplet }}-zig-ar${{ bat }}
            - ${{ library }}share/zig/wrappers/${{ conda_triplet }}-zig-ranlib${{ bat }}
            - ${{ library }}share/zig/wrappers/${{ conda_triplet }}-zig-asm${{ bat }}
            - ${{ library }}share/zig/wrappers/${{ conda_triplet }}-zig-rc${{ bat }}
            - ${{ library }}share/zig/wrappers/${{ conda_triplet }}-zig-lld${{ bat }}
            - if: unix
              then:
                - share/zig/wrappers/_zig-cc-common.sh
                - share/zig/wrappers/_zig-force-load-common.sh
                - share/zig/wrappers/${{ conda_triplet }}-zig-force-load-cc
                - share/zig/wrappers/${{ conda_triplet }}-zig-force-load-cxx
            # Post-install tests
            - etc/conda/test-files/zig*
      - script:
          - if: linux and build_platform != target_platform
            then:
              - file -L $PREFIX/bin/${{ conda_triplet }}-zig | grep -qi '${{ file_arch_keyword }}'
          - if: build_platform == target_platform
            then:
              - ${{ conda_triplet }}-zig version
          # Verify CONDA_ZIG_BUILD and CONDA_ZIG_HOST are set by activation
          - if: unix
            then:
              - test -n "$CONDA_ZIG_BUILD"
              - test -n "$CONDA_ZIG_HOST"
              - echo "CONDA_ZIG_BUILD=$CONDA_ZIG_BUILD"
              - echo "CONDA_ZIG_HOST=$CONDA_ZIG_HOST"
              - test "$CONDA_ZIG_HOST" = "${{ conda_triplet }}-zig"
            else:
              - if not defined CONDA_ZIG_BUILD exit /b 1
              - if not defined CONDA_ZIG_HOST exit /b 1
              - echo CONDA_ZIG_BUILD=%CONDA_ZIG_BUILD%
              - echo CONDA_ZIG_HOST=%CONDA_ZIG_HOST%
          # Wrapper + functional validation tests (Python, cross-platform)
          - if: unix and build_platform == target_platform
            then: PYTHONIOENCODING=utf-8 python testing/test_zig_toolchain.py
          - if: not unix and build_platform == target_platform
            then: set PYTHONIOENCODING=utf-8 && python testing/test_zig_toolchain.py
          # Cross-compiler .exe shim test (non-Unix only)
          - if: is_cross_compiler and not unix
            then:
              - set "CONDA_TRIPLET=${{ conda_triplet }}" && testing\test-cross-shim.bat
        requirements:
          build:
            - if: linux and build_platform != target_platform
              then:
                - qemu-execve-${{ target_platform | replace("linux-", "") }}
          run:
            # python runs the test_zig_toolchain.py script, but only when
            # build_platform == target_platform (see script guards above). On a
            # linux-riscv64 cross-build no python command executes, and conda-forge
            # ships no python for linux-riscv64, so the test-env solve fails. Skip
            # the requirement for riscv64 (the script never invokes python there).
            - if: not riscv64
              then:
                - python >=3.10
            - if: ppc64le
              then:
                - bash >=5.2
                - libclang-cpp ${{ llvm_version }}.*
        files:
          recipe:
            - testing/test_zig_toolchain.py
            - testing/test-cross-shim.bat

  # ==========================================================================
  # METAPACKAGE: zig (native symlinks)
  # Creates unprefixed symlinks: zig -> $TRIPLET-zig
  # Only built when cross_target_platform_ == target_platform
  # ==========================================================================
  - package:
      name: zig-zig
    build:
      number: ${{ build_number }}
      skip: cross_target_platform_ != target_platform
      script:
        file: install_zig_symlinks.py
        env:
          CONDA_TRIPLET: ${{ conda_triplet }}
          cross_target_platform_: ${{ cross_target_platform_ }}
    requirements:
      build:
        - python 3.12.*
      host:
        # Host dep ensures targets exist during build for symlink validation
        - ${{ pin_subpackage("zig-zig_" ~ cross_target_platform_, exact=True) }}
      run:
        - ${{ pin_subpackage("zig-zig_" ~ cross_target_platform_, exact=True) }}
      run_exports:
        - ${{ pin_subpackage("zig-zig", upper_bound="x.x.x") }}
    tests:
      - package_contents:
          strict: true
          bin:
            - zig
          files:
            # Post-install tests
            - if: osx
              then:
                - etc/conda/test-files/zig*
      - script:
          - if: osx
            then:
              - bash testing/fix_zigllvm_dylibs.sh
          - if: linux and build_platform != target_platform
            then:
              - file -L $PREFIX/bin/zig | grep -qi '${{ file_arch_keyword }}'
          - if: build_platform == target_platform
            then:
              - zig version
        requirements:
          build:
            - if: linux and build_platform != target_platform
              then:
                - qemu-execve-${{ target_platform | replace("linux-", "") }}
        files:
          recipe:
            - if: osx
              then:
                - testing/fix_zigllvm_dylibs.sh

  # ==========================================================================
  # TOOLCHAIN META-PACKAGE: zig-compiler (toolchain metapackage)
  # Bundles zig with C toolchain for full development environment
  # ==========================================================================
  - package:
      name: zig-zig-compiler
    build:
      number: ${{ build_number }}
      noarch: generic
      skip: cross_target_platform_ != target_platform
      script: echo "zig-compiler metapackage"
    requirements:
      run:
        - ${{ pin_subpackage("zig-zig", exact=True) }}
        - if: not riscv64
          then:
            - c-compiler
        - if: linux and not riscv64
          then:
            - binutils_impl_${{ target_platform }}
        - if: osx
          then:
            - lld
    tests:
      - script:
          - if: osx
            then:
              # Simulate zig-llvm post-install: rewrite @rpath → @loader_path
              # (Needed until zig-llvm is rebuilt with the post-install fix)
              - bash testing/fix_zigllvm_dylibs.sh
              - python testing/debug_libcxx_isolation.py
          - if: build_platform == target_platform
            then: zig version
          - if: build_platform == target_platform
            then: zig cc --version
          # Verify zig-cc activation scripts set ZIG_CC when present.
          # Script tests run unactivated, so ZIG_CC may legitimately be
          # unset here -- only validate the value when it is set.
          - if: unix
            then:
              - '[ -z "${ZIG_CC:-}" ] || test -x "${ZIG_CC}"'
          - if: unix and build_platform == target_platform
            then: '[ -z "${ZIG_CC:-}" ] || ${ZIG_CC} --version'
        requirements:
          run:
            - if: osx
              then:
                - python 3.12.*
        files:
          recipe:
            - if: osx
              then:
                - testing/fix_zigllvm_dylibs.sh
                - testing/debug_libcxx_isolation.py

about:
  homepage: https://ziglang.org/
  license: MIT AND LicenseRef-Public-Domain
  license_file:
    - zig-source/LICENSE
    - building/mingw-defs/DISCLAIMER.PD
  summary: Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software.
  description: |
    Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software.
    Robust: Behavior is correct even for edge cases such as out of memory.
    Optimal: Write programs the best way they can behave and perform.
    Reusable: The same code works in many environments which have different constraints.
    Maintainable: Precisely communicate intent to the compiler and other programmers.
      The language imposes a low overhead to reading code and is resilient to changing requirements and environments.
  documentation: https://ziglang.org/documentation/${{ version }}/
  repository: https://github.com/ziglang/zig

extra:
  recipe-maintainers:
    - MementoRC
    - xmnlab
    - tdejager
  feedstock_name: zig-zig
