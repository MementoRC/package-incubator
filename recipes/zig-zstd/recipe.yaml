schema_version: 1

context:
  build_number: 106
  version: "1.5.6"
  library: ${{ "Library/" if not unix else "" }}

  sh: ${{ ".bat" if not unix else ".sh" }}

package:
  name: zig-zstd
  version: ${{ version }}

source:
  url: https://github.com/facebook/zstd/releases/download/v${{ version }}/zstd-${{ version }}.tar.gz
  sha256: 8c29e06cf42aacc1eafc4077ae2ec6c6fcb96a626157e0593d5e82a34fd403c1

build:
  number: ${{ build_number }}
  skip: not riscv64
  script:
    file: build${{ sh }}

requirements:
  build:
    - zig-gcc_linux-riscv64 >=0.15.2,<0.16
    - cmake
    - ninja

tests:
  - package_contents:
      strict: true
      files:
        - lib/zig-zstd/include/zdict.h
        - lib/zig-zstd/include/zstd.h
        - lib/zig-zstd/include/zstd_errors.h
        - lib/zig-zstd/lib/cmake/zstd/zstdConfig.cmake
        - lib/zig-zstd/lib/cmake/zstd/zstdConfigVersion.cmake
        - lib/zig-zstd/lib/cmake/zstd/zstdTargets-release.cmake
        - lib/zig-zstd/lib/cmake/zstd/zstdTargets.cmake
        - lib/zig-zstd/lib/libzstd.so
        - lib/zig-zstd/lib/libzstd.so.*
        - lib/zig-zstd/lib/pkgconfig/libzstd.pc

about:
  homepage: https://facebook.github.io/zstd/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: zstd built with zig cc for use with zig toolchain
  description: |
    Zstandard compression library built with zig cc compiler.
    Installed to $PREFIX/lib/zig-zstd/ to avoid conflicts with system zstd.
    Used by zig-llvm to avoid glibc dependency.

extra:
  recipe-maintainers:
    - memento
